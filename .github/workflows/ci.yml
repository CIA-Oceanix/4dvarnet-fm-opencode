name: CI

on:
  pull_request:
    branches:
      - 'feat/qg-*'
      - 'feat/l96-*'
      - master
  push:
    branches:
      - 'feat/qg-*'
      - 'feat/l96-*'

jobs:
  lint:
    name: ruff lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking: the codebase has pre-existing ruff debt; reports issues
    # without failing the PR gate. Fix lint progressively; gate = pytest.
    continue-on-error: true
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install hydra-core omegaconf pytorch-lightning
      - name: Run fast test suite
        run: |
          pytest \
            tests/test_lorenz96_training.py \
            tests/test_direct_unet.py \
            tests/test_vanilla_cfm.py \
            tests/test_neural_inference.py \
            tests/test_hydra_config.py \
            tests/test_baselines_hydra.py \
            tests/test_metrics.py \
            tests/test_estimate_metrics.py \
            tests/test_joint_estimation_l96_neural.py \
            tests/test_joint_estimation_l96.py \
            tests/test_qg_dynamics.py \
            tests/test_qg_data.py \
            tests/test_qg_baselines.py \
            tests/test_qg_s0s1.py \
            tests/test_qg_random_columns.py \
            tests/test_qg1l_dynamics.py \
            tests/test_qg_psi_state.py \
            -m "not slow" -q
