name: CI

# Two jobs, the two required checks of the `master` branch protection: `pytest` and
# `changelog fragments policy` (keep both names: a required check that stops reporting under
# its name blocks every PR). Actions bills each job rounded up to the minute and the minutes are
# shared by the CIA-Oceanix organization, so the informational ruff lint runs as a step of
# `pytest` rather than as a third job.
#
# Docs-only fast path: when every changed file is text or a figure that no code or test reads
# (*.md, *.tex, *.bib, anything under docs/, md/png/pdf/gif under reports/*/outputs/), the job
# installs pytest only and runs the docs tests (layout, reports index), about 30 s instead of
# the full suite. Any other file (code, configs, committed JSON results read by tests, this
# workflow) runs the full fast suite. The check still reports, so the rulesets are unchanged.
on:
  pull_request:
    branches:
      - 'feat/qg-*'
      - 'feat/l96-*'
      - master
  push:
    branches:
      - 'feat/qg-*'
      - 'feat/l96-*'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog-policy:
    name: changelog fragments policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base commit
        run: |
          BASE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      # Blocking: CHANGELOG.md may only change through scripts/assemble_changelog.py, which
      # deletes the fragments it consumes in the same diff.
      - name: Check CHANGELOG.md was not hand-edited
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- CHANGELOG.md)
          if [ -z "$CHANGED" ]; then
            echo "CHANGELOG.md not touched -- OK."
            exit 0
          fi
          MARKER='<!-- AUTO-ASSEMBLED FROM CHANGELOG.d/ -- do not hand-edit above this line; add new files to CHANGELOG.d/ instead (see CHANGELOG.d/README.md) -->'
          if ! git show "$BASE_SHA:CHANGELOG.md" 2>/dev/null | grep -qF "$MARKER"; then
            echo "Marker absent from CHANGELOG.md in the base commit -- bootstrap PR. OK."
            exit 0
          fi
          DELETED_FRAGMENTS=$(git diff --name-only --diff-filter=D "$BASE_SHA" HEAD -- 'CHANGELOG.d/*.md')
          if [ -z "$DELETED_FRAGMENTS" ]; then
            echo "::error::CHANGELOG.md was edited directly. Add a new file to CHANGELOG.d/ instead (see CHANGELOG.d/README.md); CHANGELOG.md may only change through scripts/assemble_changelog.py, which deletes the fragments it consumes."
            exit 1
          fi
          echo "CHANGELOG.md changed together with fragment deletions (assemble_changelog.py run):"
          echo "$DELETED_FRAGMENTS"

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Base commit
        run: |
          BASE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Classify the change (docs-only or code)
        id: scope
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$CHANGED"
          OTHER=$(echo "$CHANGED" | grep -vE '\.(md|tex|bib)$|^docs/|^reports/[^/]+/outputs/.*\.(md|png|pdf|gif)$' | grep -v '^$' || true)
          if [ -n "$CHANGED" ] && [ -z "$OTHER" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: running the docs tests only."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Files outside the docs fast path:"
            echo "$OTHER"
          fi

      # Non-blocking: lint only the Python files this change touched.
      - name: Lint changed Python files (informational)
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            pip install -q ruff
            echo "$CHANGED" | xargs ruff check
          else
            echo "No changed Python files to lint."
          fi

      - name: Docs tests (docs-only change)
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          pip install -q pytest pyyaml
          # --noconftest: tests/conftest.py imports torch, which the docs tests do not need.
          pytest --noconftest tests/test_docs_layout.py tests/test_reports_index.py -q

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pip install -r requirements.txt
          pip install hydra-core omegaconf pytorch-lightning tensorboard
      - name: Run fast test suite
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          # The whole tests/ tree, not a hand-maintained file list. The list
          # this replaced named 24 of 53 files; the other 29 had never run in
          # CI, and had silently accumulated a refactor's worth of API drift
          # (see docs/plans/tech/multi_refactor_plan.md, Phase 0). A new test file is now
          # gated by existing, rather than by remembering to edit this file.
          #
          # One deliberate exclusion, tracked in docs/plans/tech/multi_refactor_plan.md:
          #   test_joint_estimation.py        -- 7 tests written against
          #       JointCFM's pre-restructure API. JointCFM itself is covered by
          #       test_joint_estimation_l96_neural.py and test_neural_inference.py.
          #       Deferred to a second step.
          pytest tests/ \
            --deselect tests/test_joint_estimation.py \
            -m "not slow" -q
