# @package _global_
defaults:
  - /lorenz96
  - _self_

data:
  data_setup: s0_s1
  bias_max: 0.2
  test_param_noise: 0.2
  param_names: [F, c1, hx, eps, w1, w2, w3, w4]
model:
  state_dim: 24
  param_dim: 8
  hidden_channels: [64, 128, 256]
  time_emb_dim: 64
  K_inner: 5
  N_outer: 10
  nu: 1.0
  use_obs: true
  use_energy: true
  dropout: 0.1
  model_type: joint_direct_unet
  direct_unet:
    hidden_channels: [64, 128, 256]
    dropout: 0.1
  joint_direct_unet:
    param_dim: 8
    param_loss_weight: 0.1
    param_head_channels: [32, 64, 128]
training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0
    lr: 0.001
    gradient_clip_val: 1.0
  batch_size: 16
  loss:
    use_gradient: true
    gradient_weight: 0.1
paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  checkpoint_stage2: checkpoints/stage2.pt
  outputs_dir: outputs
