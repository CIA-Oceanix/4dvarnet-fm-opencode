# @package _global_
# S+ complexity-tier variant of monai_direct_unet.yaml (L63), mirroring the
# L96 S+ tier (config/experiment/L1b_monai_unet_s0s1_norm_splus.yaml):
# hidden_channels [32,64,128] vs the M-tier baseline's [64,128,256], same
# data setup and training hyperparameters -- only backbone capacity changes.
# use_cosine_scheduler is set explicitly (flat LR) rather than left to the
# StageConfig default, since that default is True (deliberate policy since
# 2026-09-10, see AGENTS.md) and would otherwise silently turn this into a
# cosine run.
defaults:
  - /lorenz63
  - _self_

model:
  model_type: monai_direct_unet
  state_dim: 3
  param_dim: 4
  monai_direct_unet:
    hidden_channels: [32, 64, 128]
    dropout: 0.1
    cond_extra_dim: 5
    num_res_blocks: 2
    norm_num_groups: 32

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
    use_cosine_scheduler: false
  batch_size: 128

data:
  normalize: true

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
