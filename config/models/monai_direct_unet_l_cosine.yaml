# @package _global_
# L complexity-tier variant of monai_direct_unet.yaml (L63), cosine LR,
# mirroring the L96 L/cosine tier
# (config/experiment/L1b_monai_unet_s0s1_norm_l_cosine.yaml): the L96 report
# notes L-tier DirectUNet(monai) only beats M-tier once cosine LR fixes its
# flat-LR instability (0.487 vs M's 0.501-0.506). hidden_channels
# [128,256,512], identical to monai_direct_unet_l.yaml except
# use_cosine_scheduler: true.
defaults:
  - /lorenz63
  - _self_

model:
  model_type: monai_direct_unet
  state_dim: 3
  param_dim: 4
  monai_direct_unet:
    hidden_channels: [128, 256, 512]
    dropout: 0.1
    cond_extra_dim: 5
    num_res_blocks: 2
    norm_num_groups: 32

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
    use_cosine_scheduler: true
  batch_size: 128

data:
  normalize: true

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
