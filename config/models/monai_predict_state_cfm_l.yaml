# @package _global_
# L complexity-tier variant of monai_predict_state_cfm.yaml (L63), flat LR.
# hidden_channels [128,256,512] vs the M-tier baseline's [64,128,256]. Same
# data setup and training hyperparameters; use_cosine_scheduler is set
# explicitly (see monai_predict_state_cfm_flat.yaml for why). The L96
# DirectUNet/CFM tier study found L-tier unstable under flat LR (fixed by
# cosine annealing) -- worth watching for here too, same architecture family.
defaults:
  - /lorenz63
  - _self_

model:
  model_type: monai_predict_state_cfm
  state_dim: 3
  N_ensemble: 50
  param_dim: 4
  monai_predict_state_cfm:
    hidden_channels: [128, 256, 512]
    N_outer: 10
    sigma_prior: 1.0
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 5
    num_res_blocks: 2
    norm_num_groups: 32

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
    use_cosine_scheduler: false
  batch_size: 128

data:
  normalize: true

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
