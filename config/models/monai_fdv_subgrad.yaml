# @package _global_
# L63 analogue of the L96 FDV family (config/experiment/FDV*_monai_l96.yaml):
# 4DVarNet-style unrolled solver (models/fourdvarnet.py::FourDVarNetSolver),
# MonaiUNet1D backbone, M tier, update_input=subgrad+state. Deterministic mean estimator
# (no ensemble). Also the mean-estimate source for eval_sda_l63.py's hybrid
# mode (hybrid.mean_model=monai_fdv_subgrad).
defaults:
  - /lorenz63
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 3
  param_dim: 0
  N_ensemble: 1
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: subgrad+state
    R_var: 0.5
    clip_range: 100.0
    prior_weight: 1.0
    trainable_prior_weight: true
    aux_var_cost_weight: 0.1
    unet_backbone: monai
    monai_norm_num_groups: 32

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
    obs_weight_lr_scale: 0.5
    prior_unet_lr_scale: 0.5
  stage2:
    epochs: 0
  batch_size: 128

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
