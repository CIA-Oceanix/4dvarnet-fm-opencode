# @package _global_
# MonaiUNet1D-backed analogue of sda_prior.yaml: identical unconditional
# score-based-DA prior contract (models.sda.UnconditionalPriorCFM ->
# models.monai_unet_adapter.MonaiUnconditionalPriorCFM), guided at
# inference time the same way (eval_sda_l63.py, evaluation/sda_sampler.py).
#
# M tier (hidden [64,128,256], num_res_blocks=2) -- the only tier the L96
# benchmark validated for the SDA prior itself (SDA1(monai) S0 RMSE 0.553;
# reports/l96/outputs/l96_consolidated_benchmark.md has no S/S+-tier SDA
# prior comparison to prefer over M, unlike DirectUNet/CFM above).
#
# guidance_weight carries over sda_prior.yaml's swept value (20.0) as a
# starting point only -- MonaiUNet1D's velocity field has a different
# learned scale than UNet1D's, so this needs its own sweep before trusting
# eval_sda_l63.py's numbers for this backbone (same S0-sweep procedure as
# sda_prior.yaml's comment; see also the L96 SDA1(monai) row, which reused
# the non-monai SDA1's guidance_weight=40 rather than re-sweeping).
#
# NOT verified end-to-end in this repo: `monai` isn't in the project's
# standard env (torch/CUDA conflict -- see requirements-monai.txt / the
# 2026-09-07 CHANGELOG entry); needs a separate env with
# torch==2.8.0+cu126 + monai==1.6.0 to actually train/eval this.
defaults:
  - /lorenz63
  - _self_

model:
  model_type: monai_sda_prior
  state_dim: 3
  param_dim: 0
  N_ensemble: 50
  monai_sda_prior:
    hidden_channels: [64, 128, 256]
    N_outer: 10
    sigma_prior: 1.0
    dropout: 0.1
    num_res_blocks: 2
    norm_num_groups: 32
    guidance_weight: 20.0

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
  stage2:
    epochs: 0
  batch_size: 128

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
