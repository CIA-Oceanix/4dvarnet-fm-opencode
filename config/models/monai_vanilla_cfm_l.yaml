# @package _global_
# L complexity-tier variant of monai_vanilla_cfm.yaml (L63), flat LR,
# mirroring the L96 L tier's hidden_channels
# (config/experiment/L2b_monai_vanilla_cfm_s0s1_norm_l_cosine.yaml uses the
# same [128,256,512] at L96 -- L96 has no plain/flat L-tier CFM file, only
# the cosine one; this is the L63 flat counterpart). hidden_channels
# [128,256,512] vs the M-tier baseline's [64,128,256]. Same data setup and
# training hyperparameters; use_cosine_scheduler is set explicitly (see
# monai_vanilla_cfm_flat.yaml for why).
defaults:
  - /lorenz63
  - _self_

model:
  model_type: monai_vanilla_cfm
  state_dim: 3
  N_ensemble: 50
  param_dim: 4
  monai_vanilla_cfm:
    hidden_channels: [128, 256, 512]
    N_outer: 10
    sigma_prior: 1.0
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 5
    num_res_blocks: 2
    norm_num_groups: 32

training:
  stage1:
    epochs: 3000
    lr: 0.001
    gradient_clip_val: 10.0
    early_stopping_patience: 300
    early_stopping_min_delta: 0.001
    use_cosine_scheduler: false
  batch_size: 128

data:
  normalize: true

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  outputs_dir: outputs
