data:
  system: lorenz96
  state_names: ["X1", "X2", "X3", "X4", "X5", "X6", "X7", "X8"]
  param_names: ["F"]
  dt: 0.001
  T_max: 3.0
  obs_interval: 100
  R_var: 0.5
  B_var: 2.0
  num_windows: 2000
  window_spacing: 2000
  spinup_steps: 10000
  seed: 42
  NO: 8
  J: 4
  h: 1.0
  hx: 1.0
  eps: 0.1
  F_true: 8.0
  F_da: 8.0
  gamma: 0.05
  W_L_bar: 0.0
  c1: 1.0
  c2: 0.1
  sigma_0: 0.08
  sigma_L: 0.20
  tau_eta: 5.0
  sigma_eta: 0.7071067811865476
  forcing_state_bias: 0.0
  forcing_coupling: linear
  param_bias: 0.0
  case: 1
  obs_j: 2
  fast_weights: [1.0, 1.0, 0.1, 0.1]
  randomize:
    fast_weights:
      randomized: true
      noise: 0.2
      biased: false
      bias: 0.0
    F:
      randomized: true
      noise: 0.2
      biased: false
      bias: 0.0
    c1:
      randomized: true
      noise: 0.2
      biased: false
      bias: 0.0
    h:
      randomized: false
      noise: 0.2
      biased: false
      bias: 0.0
    hx:
      randomized: true
      noise: 0.2
      biased: false
      bias: 0.0
    eps:
      randomized: true
      noise: 0.2
      biased: false
      bias: 0.0

model:
  state_dim: 24
  param_dim: 0
  hidden_channels: [64, 128, 256]
  time_emb_dim: 64
  K_inner: 5
  N_outer: 10
  nu: 1.0
  use_obs: true
  use_energy: true
  dropout: 0.1

training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0
    lr: 0.001
    gradient_clip_val: 1.0
  batch_size: 16
  loss:
    use_gradient: true
    gradient_weight: 0.1

paths:
  checkpoint_dir: checkpoints
  checkpoint_stage1: checkpoints/stage1.pt
  checkpoint_stage2: checkpoints/stage2.pt
  outputs_dir: outputs

baselines:
  da_window_steps: 500
  N_ensemble: 30
  batch_size: 16
  weak4dvar:
    opt_steps: 150
    lr: 0.02
  strong4dvar:
    max_iter: 40
    lr: 0.1
  enkf:
    inflation: 1.0
  etkf:
    inflation: 1.0

cs1:
  param_bias: 0.0
  forcing_coupling: linear

cs2:
  param_bias: 0.15
  forcing_state_bias: 0.15
  forcing_coupling: quartic
