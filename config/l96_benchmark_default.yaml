# @package _global_
# L96 benchmark default (agreed 2026-09-23). Experiment configs pick this up via
#   defaults: [/l96_benchmark_default, _self_]
# and set only the model section. lorenz96_default itself is deliberately NOT
# changed: 100+ existing experiment configs inherit it.
#
# Training obs = random observing system, redrawn for every window of every
# batch with fresh noise (data/obs_times.py::resample_obs_variable):
#   - n_obs ~ U{10..300} obs times, stratified (one random step per
#     3000/n_obs-step block)
#   - k ~ U{4..16} observed fast channels, drawn once per window (random subset
#     per obs time); the 8 slow channels are always observed
# Frozen per-window training obs (the P1 setting) are an artefact, not an
# option: they cost DirectUNet-M ~20% RMSE.
#
# Evaluation: report BOTH the regular 30-time full-density test set
# (test_cache below) and the random 30-obs / 8-fast re-observed test set
# (scripts/make_l96_random_obs_testset.py --n-obs 30 --n-fast 8).
#
# Everything else = the P1 recipe: normalize, cosine annealing (project
# default since 2026-09-10), 400 epochs, lr 1e-3, clip 10, batch 16, no
# obs-density augmentation, S0/S1 training data, 24D observed space.
defaults:
  - /lorenz96_default
  - _self_
model:
  state_dim: 24
  param_dim: 0
training:
  stage1: {epochs: 400, lr: 0.001, gradient_clip_val: 10.0, use_cosine_scheduler: true}
  stage2: {epochs: 0}
  batch_size: 16
data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  obs_density_augment: false
  obs_random_layout: true
  obs_n_range: [10, 300]
  obs_fast_range: [4, 16]
  test_cache: /Odyssey/private/rfablet/Python/4dvarnet-fm-opencode/experiments/l96_datasets_obsj2_int100_nwin200.pt
