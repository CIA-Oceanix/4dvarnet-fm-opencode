# @package _global_
defaults:
  - /lorenz96_default
  - _self_

experiment_id: L3_smoke

model:
  model_type: vanilla_cfm
  state_dim: 24
  param_dim: 0
  vanilla_cfm:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 0

training:
  stage1:
    epochs: 1
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

smoke_cached_data: experiments/l96_datasets_obsj2_int100_nwin200.pt

data:
  data_setup: s0_s1
  bias_max: 0.2
  num_train_windows: 10
  num_val_windows: 5
  num_test_windows: 10
  test_param_noise: 0.2
