# @package _global_
# VanillaCFM-M on Lorenz-63, L96-benchmark recipe (config/l96_benchmark_default.yaml):
# 1200 epochs, cosine LR, lr 1e-3, clip 10, batch 16, S0/S1 training data, no parameters as input.
# 30 observations per 300-step window (obs_interval 10).
defaults:
  - /lorenz63_default
  - _self_
model:
  model_type: monai_vanilla_cfm
  state_dim: 3
  param_dim: 0
  monai_vanilla_cfm:
    hidden_channels: [64, 128, 256]
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 32
training:
  stage1: {epochs: 1200, lr: 0.001, gradient_clip_val: 10.0, use_cosine_scheduler: true}
  stage2: {epochs: 0}
  batch_size: 16
  seed: null
  loss: {use_gradient: true, gradient_weight: 0.1}
data:
  data_setup: s0_s1
  obs_interval: 10
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
