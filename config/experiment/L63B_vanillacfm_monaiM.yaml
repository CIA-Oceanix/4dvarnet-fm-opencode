# @package _global_
# VanillaCFM-M (MONAI backbone, multi-tau) on L63 -- same data/budget as L63B_directunet_monaiM.
defaults:
  - /experiment/L63B_directunet_monaiM
  - _self_
model:
  model_type: monai_vanilla_cfm
  monai_vanilla_cfm:
    hidden_channels: [64, 128, 256]
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 32
