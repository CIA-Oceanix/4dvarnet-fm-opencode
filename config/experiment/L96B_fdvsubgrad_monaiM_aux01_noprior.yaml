# @package _global_
# ABLATION of L96B_fdvsubgrad_monaiM_aux01: identical (aux prior loss 0.01), but the x - Phi(x)
# input channel is forced to zero (zero_prior_input), so Phi no longer affects the solver and is
# trained by the aux loss only. Tests whether the prior residual channel carries information.
# Original header of the aux01 config:
# FDV2 subgrad+state, M tier, benchmark default -- L96B_fdvsubgrad_monaiM with the aux
# prior-consistency loss ON (aux_var_cost_weight 0.01, the S-tier value). At 0.0 the
# prior_unet Phi of subgrad-M gets no direct training signal as a prior (only through the
# unroll), and subgrad-M trailed FDV1-M by ~3% RMSE; at S, with 0.01 for both, subgrad
# beat FDV1 by 9-10%. The 0.0 at M came from an FDV1-M ablation
# (CHANGELOG.d/2026-09-12-fdv1-xstier-auxpriorcost-ablation.md), never tested on subgrad.
defaults:
  - /l96_benchmark_default
  - _self_
model:
  model_type: fourdvarnet
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: subgrad+state
    clip_range: 50.0
    init_state_var: 0.1
    aux_var_cost_weight: 0.01
    zero_prior_input: true
    unet_backbone: monai
    monai_norm_num_groups: 32
    monai_num_res_blocks: 2
