# @package _global_
# FDV1's own architecture (update_input=obs+state), identical to
# FDV1_unrolled_monai_unet_l96, except the solver's initial condition x_0
# is no longer all-zeros: init_state_var=0.1 samples x_0 ~ N(0, 0.1) (a
# VARIANCE, not a std -- std ~ 0.316 in this normalized state space) fresh
# on every forward() call, instead of the fixed x_0=0 start every other FDV
# config (FDV1 and FDV2 alike) uses. Sanity/robustness check: does FDV1's
# own healthy fast-Y reconstruction (variance ratio ~0.93, correlation
# ~0.95) hold up under a nonzero-variance random init, or does it rely on
# the deterministic zero start in some way?
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: obs+state
    R_var: 0.5
    clip_range: 50.0
    init_state_var: 0.1
    unet_backbone: monai
    monai_norm_num_groups: 32

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
