# @package _global_
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: sda_prior_cond
  state_dim: 24
  param_dim: 8
  sda_prior:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  train_forcing_state_bias: 0.1
  param_names: [F, c1, hx, eps, w1, w2, w3, w4]
