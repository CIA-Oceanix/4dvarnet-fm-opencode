# Q8: T-channels retrain of Q3 (oracle forcing+param conditioning) --
# `model_type=direct_unet_tchannels` (Q7's own T-merged-into-channels
# backbone, `models.monai_unet_qg2d.MonaiDirectUNetQGChannelTime`) instead
# of Q3's `MonaiDirectUNetQG` (T folded into the batch dim, no cross-day
# coupling at all). Same oracle-conditioning role as Q3 (exact true
# wind_curl field + true [U1,rd,rek] params, cond_mode="true") -- part of
# the 2026-09-14 T-channels bench refresh: Q7/Q8/Q9/Q10 replace Q1/Q3/Q4/
# Q5 as the DirectUNet-family entries once all four are trained, since Q7
# already beat Q1 outright on both psi and q (see PLAN.md's 2026-09-14 Q7
# section).
#
# No obs_noise_std_frac/init_lag_days override here (unlike Q3, which
# pins the old 0.01/1.0 default explicitly to preserve its historical
# trained-at values) -- this is a genuinely NEW config, so it picks up
# train_qg_neural.py's current fallback default directly: lag=5.0d/
# noise=0.05, the DA-baseline reference case (see PLAN.md's 2026-09-14
# "Training default now matches the DA eval default" section). Trains
# apples-to-apples with the DA comparison from the start, unlike Q3 (which
# needed a separate Q3-noise0.05 retrain after the fact to get there).
#
# gradient_clip_val: 1.0 (not the 10.0 default), proactively: Q3-noise0.05
# hit a reproducible training collapse at this same noise level with the
# default clip (see Q3_direct_unet_s0_oracle_cond_noise05.yaml), confirmed
# independent of seed. Applying the fix up front here avoids repeating
# that ablation for a new architecture at the same noise level.
#
# Shares model_type=direct_unet_tchannels with Q7/Q9/Q10 -- pass --exp-id
# explicitly:
#
#   python train_qg_neural.py \
#     --model-type direct_unet_tchannels \
#     --exp-id Q8_direct_unet_tchannels_s0_oracle_cond \
#     --exp-dir experiments/Q8_direct_unet_tchannels_s0_oracle_cond \
#     --nx 64 --epochs 200 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# experiments/qg_{psi,param,forcing}_norm_stats.pt must exist first
# (batch/run_qg_param_stats.sbatch) -- reused unchanged from Q1/Q3 (these
# stats are computed from the true trajectory/params/wind_curl, which
# don't depend on obs_noise_std_frac/init_lag_days at all).

experiment_id: Q8_direct_unet_tchannels_s0_oracle_cond
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet_tchannels
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [64, 128, 256]
  # +1 forcing-field channel (the real wind-curl map, see cond_mode="true")
  # +3 param channels ([U1, rd, rek], z-scored via param_norm_stats -- beta
  # is deliberately excluded, see data/qg_neural.py's PARAM_KEYS comment).
  param_dim: 3
  cond_extra_dim: 1
training:
  epochs: 200
  lr: 0.001
  batch_size: 2
  # = 1/Var(q_raw), see Q1_direct_unet_s0.yaml (same train split/stats;
  # forcing+param conditioning doesn't change the psi/q target distribution).
  q_loss_weight: 2.5415e9
  gradient_clip_val: 1.0
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
  # Oracle: exact true wind_curl field + true [U1,rd,rek], no jitter.
  cond_mode: "true"  # quoted: bare `true` parses as a YAML boolean, not this string
  param_norm_stats_path: experiments/qg_param_norm_stats.pt
  forcing_norm_stats_path: experiments/qg_forcing_norm_stats.pt
