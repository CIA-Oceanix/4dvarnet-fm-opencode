# Q2 (2026-09-14, promoted from "Q8"): DirectUNet on QG S0, oracle
# forcing+param conditioning (exact true wind_curl field + true
# [U1,rd,rek] params, cond_mode="true"), on the T-merged-into-channels
# backbone (Q1's own `models.monai_unet_qg2d.MonaiDirectUNetQGChannelTime`)
# -- part of the canonical T-channels benchmark family (Q1=obs-only,
# Q2=oracle cond., Q3=noisy cond., Q4=noisy cond.+IC), superseding the
# older batch-folding-backbone Q3/Q3-noise0.05 (config/experiment/
# Q3_direct_unet_s0_oracle_cond*.yaml -- kept on disk as historical
# experiments, no longer the benchmark headline).
#
# Trained directly at the DA reference case's own lag=5.0d/noise=0.05
# (train_qg_neural.py's own current fallback default), so it's genuinely
# apples-to-apples with the DA baselines from the start -- no separate
# "-noise05" retrain needed, unlike the older Q3/Q3-noise0.05 pair.
#
# See PLAN.md's 2026-09-14 T-channels-bench-refresh section for the full
# history (this scheme was originally trained as "Q8") and
# reports/qg/outputs/qg_neural_report.md for the current benchmark table.
#
# gradient_clip_val: 1.0 (not the 10.0 default), precautionary: Q3-noise0.05
# (the older-backbone equivalent) hit a reproducible training collapse at
# this same noise level with the default clip.
#
# Shares model_type=direct_unet_tchannels with Q1/Q3/Q4 -- pass --exp-id
# explicitly:
#
#   python train_qg_neural.py \
#     --model-type direct_unet_tchannels \
#     --exp-id Q2_direct_unet_tchannels_s0_oracle_cond \
#     --exp-dir experiments/Q2_direct_unet_tchannels_s0_oracle_cond \
#     --nx 64 --epochs 200 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# experiments/qg_{psi,param,forcing}_norm_stats.pt must exist first
# (batch/run_qg_param_stats.sbatch) -- these stats are computed from the
# true trajectory/params/wind_curl, which don't depend on
# obs_noise_std_frac/init_lag_days at all.

experiment_id: Q2_direct_unet_tchannels_s0_oracle_cond
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet_tchannels
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [64, 128, 256]
  # +1 forcing-field channel (the real wind-curl map, see cond_mode="true")
  # +3 param channels ([U1, rd, rek], z-scored via param_norm_stats -- beta
  # is deliberately excluded, see data/qg_neural.py's PARAM_KEYS comment).
  param_dim: 3
  cond_extra_dim: 1
training:
  epochs: 200
  lr: 0.001
  batch_size: 2
  # = 1/Var(q_raw), see Q1_direct_unet_s0.yaml (same train split/stats;
  # forcing+param conditioning doesn't change the psi/q target distribution).
  q_loss_weight: 2.5415e9
  gradient_clip_val: 1.0
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
  # Oracle: exact true wind_curl field + true [U1,rd,rek], no jitter.
  cond_mode: "true"  # quoted: bare `true` parses as a YAML boolean, not this string
  param_norm_stats_path: experiments/qg_param_norm_stats.pt
  forcing_norm_stats_path: experiments/qg_forcing_norm_stats.pt
