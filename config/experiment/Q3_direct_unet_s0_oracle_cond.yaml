# Q3: DirectUNet on QG S0, additionally conditioned on the ORACLE (true)
# wind-forcing field + true physical params, alongside observations.
#
# Answers: does exogenous conditioning on the exact forcing/params help a
# DirectUNet estimator, when that conditioning is perfectly accurate? See
# PLAN.md's 2026-09-10 QG Q3/Q4 section for the full design rationale
# (mirrors the L96 SDA CFM forcing/param-conditioning study) and
# `data/qg_neural.py`'s cond_mode docstring for the exact mechanism.
#
# Shares model_type=direct_unet with Q1 -- pass --exp-id explicitly:
#
#   python precompute_qg_norm_stats.py --cache-dir reports/qg_cache \
#     --output experiments/qg_psi_norm_stats.pt \
#     --output-params experiments/qg_param_norm_stats.pt   # once, before training
#   python train_qg_neural.py \
#     --model-type direct_unet --exp-id Q3_direct_unet_s0_oracle_cond \
#     --exp-dir experiments/Q3_direct_unet_s0_oracle_cond \
#     --nx 64 --epochs 200 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# Same split/seed/obs-protocol/normalization/cosine-LR conventions as Q1
# (see Q1_direct_unet_s0.yaml for the full rationale) -- this config only
# adds the forcing+param conditioning on top.

experiment_id: Q3_direct_unet_s0_oracle_cond
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [64, 128, 256]
  # +1 forcing-field channel (the real wind-curl map, see cond_mode="true")
  # +4 param channels ([U1, rd, rek, beta], z-scored via param_norm_stats).
  param_dim: 4
  cond_extra_dim: 1
training:
  epochs: 200
  lr: 0.001
  batch_size: 2
  # = 1/Var(q_raw), see Q1_direct_unet_s0.yaml (same train split/stats;
  # forcing+param conditioning doesn't change the psi/q target distribution).
  q_loss_weight: 2.5415e9
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
  # Oracle: exact true wind_curl field + true [U1,rd,rek,beta], no jitter.
  cond_mode: true
  param_norm_stats_path: experiments/qg_param_norm_stats.pt
