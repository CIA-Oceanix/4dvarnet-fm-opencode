# Q3-lag5: same oracle (true forcing/params) conditioning as
# Q3_direct_unet_s0_oracle_cond.yaml, but trained at the DA reference case's
# own obs/IC protocol (init_lag_days=5.0, obs_noise_std_frac=0.05) instead
# of Q1/Q3/Q4's 1.0d/0.01 defaults -- paired with Q5 (see PLAN.md's
# 2026-09-11 Q5 section) so the "oracle vs. IC-augmented" comparison isn't
# confounded by also comparing across two different training distributions.
#
# Unlike Q5, this does NOT add the IC input and does NOT change the noisy-
# conditioning severity (irrelevant here: cond_mode="true" never resamples,
# it always uses the exact true forcing/params regardless of s1_param_bias/
# noisy_max).
#
# Shares model_type=direct_unet with Q1/Q3/Q4/Q5 -- pass --exp-id explicitly:
#
#   python train_qg_neural.py \
#     --model-type direct_unet --exp-id Q3_direct_unet_s0_oracle_cond_lag5 \
#     --exp-dir experiments/Q3_direct_unet_s0_oracle_cond_lag5 \
#     --nx 64 --epochs 200 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# psi/param/forcing norm stats reused unchanged from the original Q1/Q3/Q4
# precompute (see Q5's config comment for why: they don't depend on
# obs_noise_std_frac/init_lag_days at all).

experiment_id: Q3_direct_unet_s0_oracle_cond_lag5
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [64, 128, 256]
  param_dim: 3
  cond_extra_dim: 1
training:
  epochs: 200
  lr: 0.001
  batch_size: 2
  q_loss_weight: 2.5415e9
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
  cond_mode: "true"  # quoted: bare `true` parses as a YAML boolean, not this string
  param_norm_stats_path: experiments/qg_param_norm_stats.pt
  forcing_norm_stats_path: experiments/qg_forcing_norm_stats.pt
  # The DA reference case's own obs/IC protocol (see Q5's config comment).
  init_lag_days: 5.0
  obs_noise_std_frac: 0.05
