# @package _global_
# L96B_fdvresidmask_monaiM with the residual rescaled per sample and per iteration by its
# RMS over observed entries, and log-RMS fed as an extra constant channel block
# (update_input residnorm+mask+state).
defaults:
  - /l96_benchmark_default
  - _self_
model:
  model_type: fourdvarnet
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: residnorm+mask+state
    clip_range: 50.0
    init_state_var: 0.1
    aux_var_cost_weight: 0.0
    unet_backbone: monai
    monai_norm_num_groups: 32
    monai_num_res_blocks: 2
