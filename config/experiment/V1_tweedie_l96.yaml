# @package _global_
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: tweedie
  state_dim: 24
  param_dim: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2

training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 1.0
