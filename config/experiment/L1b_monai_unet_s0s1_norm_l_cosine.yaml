# @package _global_
# Cosine-annealing variant of L1b_monai_unet_s0s1_norm_l (L tier, [128,256,512],
# num_res_blocks=2, 23,476,248 params). Identical to the flat-LR L-tier runs
# (RMSE 0.765-0.891/0.767-0.895 across two seeds, both worse than M-tier)
# except training.stage1.use_cosine_scheduler is now true (CosineAnnealingLR
# over the full 200-epoch run), added for consistency with FDV2's
# cosine-annealed training (PR #168) so the S+/M/L tier comparison is redone
# under the same scheduler policy. NOTE: the DA-benchmark eval step for this
# tier OOMs at the default --batch-size 200 (26.8GiB attention allocation on a
# 44GB GPU) -- must be run with a smaller --batch-size (16 confirmed working).
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: monai_direct_unet
  state_dim: 24
  param_dim: 0
  monai_direct_unet:
    hidden_channels: [128, 256, 512]
    dropout: 0.1
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 32

training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  test_cache: experiments/l96_datasets_obsj2_int100_nwin200.pt
