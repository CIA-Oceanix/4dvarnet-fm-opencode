# @package _global_
# Diagnostic-only: does DirectUNet's normalized-training collapse (flat
# train_loss=1.000 for 200 epochs with lr=0.001) resolve with a lower LR?
# Clone of L1b_direct_unet_s0s1_norm with lr=1e-4, shorter budget (50 epochs
# is enough to see whether it starts descending -- L3 dropped from 0.71 to
# 0.15 within 14 epochs when it's actually learning).
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: direct_unet
  state_dim: 24
  param_dim: 0
  direct_unet:
    hidden_channels: [64, 128, 256]
    dropout: 0.1
    cond_extra_dim: 0

training:
  stage1:
    epochs: 50
    lr: 0.0001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  test_cache: experiments/l96_datasets_obsj2_int100_nwin200.pt
