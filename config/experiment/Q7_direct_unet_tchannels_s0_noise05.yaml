# Q7-noise05: Q7 (T-channels DirectUNet, obs-only) retrained at the DA
# reference case's own lag=5.0d/noise=0.05 -- mirrors the
# Q3/Q3-noise0.05 precedent: Q7 itself was trained at the old easy
# lag=1.0d/noise=0.01 default (pinned explicitly in
# Q7_direct_unet_tchannels_s0.yaml), so it's the WRONG obs-only reference
# point for a table that also contains Q8/Q9/Q10 (all trained at 0.05/5.0,
# apples-to-apples with the DA baselines by construction) -- comparing
# Q7's easy-obs numbers against Q8/Q9/Q10's hard-obs numbers would
# conflate "conditioning helps" with "easier observations help." This
# config isolates the backbone/conditioning comparison at matched
# observation difficulty for the 2026-09-14 T-channels bench refresh (see
# PLAN.md's "T-channels bench refresh" section).
#
# No obs_noise_std_frac/init_lag_days override -- like Q8/Q9/Q10, this
# picks up train_qg_neural.py's current fallback default (0.05/5.0)
# directly, since (unlike the original Q7) it's meant to train at that
# value, not preserve a historical one.
#
# gradient_clip_val: 1.0 (not the 10.0 default), same precautionary
# reasoning as Q8/Q9/Q10 -- Q3-noise0.05 hit a reproducible training
# collapse at this same noise level with the default clip.
#
# Shares model_type=direct_unet_tchannels with Q7/Q8/Q9/Q10 -- pass
# --exp-id explicitly:
#
#   python train_qg_neural.py \
#     --model-type direct_unet_tchannels \
#     --exp-id Q7_direct_unet_tchannels_s0_noise05 \
#     --exp-dir experiments/Q7_direct_unet_tchannels_s0_noise05 \
#     --nx 64 --epochs 200 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# experiments/qg_psi_norm_stats.pt must exist first
# (batch/run_qg_param_stats.sbatch) -- reused unchanged from Q1/Q7.

experiment_id: Q7_direct_unet_tchannels_s0_noise05
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet_tchannels
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [64, 128, 256]
  param_dim: 0
  cond_extra_dim: 0
training:
  epochs: 200
  lr: 0.001
  batch_size: 2
  # Same derivation as Q1 (1/Var(q_raw) over the 1000-window train split,
  # nx=64, train-seed=42) -- unrelated to the model architecture, so Q1's
  # own precomputed value applies unchanged.
  q_loss_weight: 2.5415e9
  gradient_clip_val: 1.0
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
