# @package _global_
# Same as FDV2_grad_state_monai_l96_Stier_priorresidual_N5.yaml (grad+state,
# prior_residual=true, trainable_prior_weight=true, prior_dropout=0.0 for
# prior_unet, dropout=0.1 for the main solver unet), but with the full
# N_outer=10 unroll depth restored, split into tbptt_n_blocks=2 truncated-
# BPTT blocks of tbptt_block_size=5 each (the graph is detached at the
# midpoint, k=5) instead of that run's single-block N_outer=5.
#
# Tests the truncated-BPTT lever directly (already implemented, see
# FourDVarNetSolver's tbptt_n_blocks/tbptt_block_size): job 53501's own
# N_outer=5 change shortens the double-backward chain AND halves the number
# of solver iterations available at eval time -- conflating "does a shorter
# double-backward chain train better" with "does the model need fewer
# iterations to converge." This config keeps the full 10-iteration unroll
# (same iteration budget as every other Stier config) while still
# detaching the graph every 5 steps, isolating the double-backward-chain-
# length effect from the iteration-count effect. compute_loss's deep-
# supervision term (mean MSE over both block-end states, when self.training)
# also gives prior_unet/self.unet a direct gradient signal at k=5, not just
# k=10.
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [32, 64, 128]
    time_emb_dim: 64
    N_outer: 10
    tbptt_n_blocks: 2
    tbptt_block_size: 5
    dropout: 0.1
    prior_dropout: 0.0
    update_input: grad+state
    R_var: 0.5
    prior_weight: 1.0
    clip_range: 50.0
    grad_clip_range: 5.0
    trainable_prior_weight: true
    init_state_var: 0.1
    aux_var_cost_weight: 0.01
    prior_residual: true
    unet_backbone: monai
    monai_norm_num_groups: 32
    monai_num_res_blocks: 1

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
