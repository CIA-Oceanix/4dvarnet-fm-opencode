# @package _global_
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: joint_direct_unet
  state_dim: 24
  param_dim: 8
  direct_unet:
    hidden_channels: [64, 128, 256]
    dropout: 0.1
  joint_direct_unet:
    param_dim: 8
    param_loss_weight: 0.1

training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  param_names: [F, c1, hx, eps, w1, w2, w3, w4]
