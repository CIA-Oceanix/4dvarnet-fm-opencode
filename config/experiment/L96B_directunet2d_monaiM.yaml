# @package _global_
# DirectUNet with the 2D (time x sector) circular backbone (models/monai_unet_l96_2d.py)
# under the L96 benchmark default (1200 epochs). Parameter-matched to DirectUNet-M
# (5.63 M vs 5.89 M): widths [40, 80, 160], GroupNorm 8 (40 is not a multiple of 32).
# Compare against L96B_directunet_monaiM_ep1200 (same data, loss, optimiser, epochs).
defaults:
  - /l96_benchmark_default
  - _self_
model:
  model_type: monai_direct_unet_2d
  monai_direct_unet_2d:
    hidden_channels: [40, 80, 160]
    dropout: 0.1
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 8
    mid_attention: time
    use_flash_attention: true
training:
  loss: {use_gradient: true, gradient_weight: 0.1}
