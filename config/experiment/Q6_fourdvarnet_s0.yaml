# Q6: FourDVarNetSolver (FDV1) neural baseline on QG S0 -- same obs-only
# role as Q1 (no forcing/param/IC conditioning: FourDVarNetSolver has no
# such hooks at all, unlike DirectUNet), but an unrolled variational solver
# instead of a single-pass CNN. Non-architecture hyperparameters (N_outer,
# update_input, R_var, aux_var_cost_weight=0.01, etc.) mirror L96's current
# winning "S"-tier config (`FDV1_obsstate_monai_l96_initvar01_Stier_
# auxpriorcost01.yaml`, on the `feature/l96-fdv2-stier-sweep` branch).
#
# unet_backbone=monai2d (2026-09-14, revised from an earlier "monai"
# attempt): `models.monai_unet_qg2d.MonaiUNet2DQGSolver`, a genuinely 2D
# circular-conv backbone (matches Q1's own MonaiDirectUNetQG architecture)
# that merges the T (days) axis into the *channel* dimension
# (T*channels_per_day total) instead of either (a) the original "monai"
# backbone's convention of treating T as its own downsampled 1D-sequence
# axis (required T divisible by the backbone's downsampling depth -- QG's
# 30-day windows aren't, needed an awkward pad/crop workaround), or (b)
# MonaiDirectUNetQG's own convention of folding T into the *batch*
# dimension (every day processed fully independently, no cross-day
# coupling at all, unlike this scheme's design intent). Every day keeps
# its true (ny, nx) circular grid; the network mixes information across
# days via ordinary channel mixing in the conv layers instead. No T-axis
# divisibility constraint at all (only ny/nx need to divide the
# backbone's downsampling depth, and QG's 64x64 grid already comfortably
# does) -- qg_T/qg_ny/qg_nx are threaded through automatically by
# train_qg_neural.py's build_model() from the QGConfig, not set here.
#
# "S"-tier for this backbone: hidden_channels=[32,64,128],
# monai_num_res_blocks=1 (same ratio to Q1's M-tier [64,128,256]/2 as
# L96's own S-tier is to its M-tier). monai_norm_num_groups=4 (not Q1's 8):
# MONAI requires every channel count -- including the T*channels_per_day
# totals this backbone builds internally (120 for the main solver's
# "obs+state" concatenation, 60 for the prior_unet) -- to be a multiple of
# norm_num_groups; 4 is the largest value dividing all of
# {32, 64, 128, 60, 120}.
#
# Real correctness bug fixed as a prerequisite (2026-09-13): FourDVarNetSolver's
# obs cost only supported a per-*timestep* mask (uniform across the whole
# state vector), fine for L96 (fixed observable-channel subset, obs_j) but
# wrong for QG (`cols_per_day` sparse columns vary both per day *and* per
# cell within an observed day) -- feeding it QG's old day-level any-obs
# mask would have silently treated every unobserved cell's zero-fill as a
# real obs=0 measurement. Fixed: `QGBatch.obs_mask` is now a genuine
# per-cell mask (unused by direct_unet/vanilla_cfm, which never read it),
# and `models/fourdvarnet.py`'s `_unrolled_blocks` only `.unsqueeze(-1)`s a
# 2D (B,T) mask, using an already-3D (B,T,D) mask as-is -- backward-
# compatible with L96's own (B,T) convention. Caveat, unchanged by the
# monai2d switch: `update_input=obs+state` never references obs_mask at
# all, so this fix has no effect on Q6's own results either way -- see
# PLAN.md's 2026-09-13/14 Q6 section.
#
# Shares no model_type with Q1/Q3/Q4/Q5/Q1-obsdensity (all direct_unet) --
# pass --exp-id explicitly anyway, for consistency with those configs:
#
#   python train_qg_neural.py \
#     --model-type fourdvarnet --exp-id Q6_fourdvarnet_s0 \
#     --exp-dir experiments/Q6_fourdvarnet_s0 \
#     --nx 64 --epochs 400 \
#     --num-train 1000 --num-val 100 --num-test 100 \
#     --batch-size 2 --cache-dir reports/qg_cache
#
# experiments/qg_psi_norm_stats.pt must exist first
# (batch/run_qg_param_stats.sbatch) -- reused unchanged from Q1.

experiment_id: Q6_fourdvarnet_s0
entry_point: train_qg_neural.py
system: qg
model_type: fourdvarnet
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  param_dim: 0
  cond_extra_dim: 0
  fdv:
    hidden_channels: [32, 64, 128]
    N_outer: 10
    dropout: 0.1
    update_input: obs+state
    R_var: 0.5
    clip_range: 50.0
    init_state_var: 0.1
    aux_var_cost_weight: 0.01
    unet_backbone: monai2d
    monai_norm_num_groups: 4
    monai_num_res_blocks: 1
training:
  epochs: 400
  lr: 0.001
  batch_size: 2
  gradient_clip_val: 10.0
  # Same derivation as Q1 (1/Var(q_raw) over the 1000-window train split,
  # nx=64, train-seed=42) -- unrelated to the model architecture, so
  # Q1's own precomputed value applies unchanged.
  q_loss_weight: 2.5415e9
data:
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 100
  on_the_fly_split_obs: true
  cache_dir: reports/qg_cache
  normalize: true
  norm_stats_path: experiments/qg_psi_norm_stats.pt
  # Pinned explicitly (2026-09-14, see Q1_direct_unet_s0.yaml's fuller
  # comment / PLAN.md): train_qg_neural.py's fallback default changed to
  # the DA reference case (0.05/5.0) -- this preserves this config's
  # actual trained-at values unchanged.
  obs_noise_std_frac: 0.01
  init_lag_days: 1.0
