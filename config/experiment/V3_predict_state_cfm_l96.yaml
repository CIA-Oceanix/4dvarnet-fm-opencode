# @package _global_
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: predict_state_cfm
  state_dim: 24
  param_dim: 0
  predict_state_cfm:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    cond_extra_dim: 0

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 1.0
  stage2:
    epochs: 0
    lr: 0.001
    gradient_clip_val: 1.0

paths:
  out_dir: "experiments/V3_predict_state_cfm_s0s1"
