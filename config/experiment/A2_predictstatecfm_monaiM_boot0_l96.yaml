# @package _global_
# T2a: bootstrapped tau=0 targets. A quarter of each batch at tau=0 with target
# sg D_teacher(x_tau', tau'), tau' ~ U[0.2, 0.5]; EMA teacher (decay 0.999) from epoch 50,
# target x1 before that (identical to T1' until then).
# Base: A2_predictstatecfm_monaiM_l96 (P1 recipe), unchanged apart from the options below and
# training.seed=1, which pairs every arm with the T0 reseed (same init and batch order).
defaults:
  - /lorenz96_default
  - _self_
model:
  model_type: monai_predict_state_cfm
  state_dim: 24
  param_dim: 0
  monai_predict_state_cfm:
    hidden_channels: [64, 128, 256]
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 32
    boot_frac: 0.25
    boot_tau_min: 0.0
    boot_tau_max: 0.0
    boot_dtau_min: 0.2
    boot_dtau_max: 0.5
    boot_alpha: 1.0
    boot_ema_decay: 0.999
    boot_start_epoch: 50
training:
  stage1: {epochs: 400, lr: 0.001, gradient_clip_val: 10.0, use_cosine_scheduler: true}
  stage2: {epochs: 0}
  batch_size: 16
  seed: 1
data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  norm_stats_path: /Odyssey/private/rfablet/Python/4dvarnet-fm-opencode/experiments/l96_norm_stats_obsj2.pt
  obs_density_augment: false
  test_cache: /Odyssey/private/rfablet/Python/4dvarnet-fm-opencode/experiments/l96_datasets_obsj2_int100_nwin200.pt
