# G1-L, batch-16 protocol (2026-10-05): same model, data, loss and observing system as
# G1L_direct_unet_tchannels_specwind.yaml, trained on the L96-like budget -- batch 16, 1200
# epochs (75k optimizer steps), peak LR 5e-4 with a 40-epoch warm-up then cosine,
# a fresh 1000-window round every 30 epochs (40 rounds, as at batch 2), 10 data workers.
# The batch-2 / 200-epoch row is the comparison point; b16 and b64 differ only by the batch.
#
#   python train_qg_neural.py --model-type direct_unet_tchannels --exp-id G1L_direct_unet_tchannels_specwind_b16 \
#     --exp-dir experiments/qg_specwind_neural/G1L_direct_unet_tchannels_specwind_b16 \
#     --specwind-spec qg_specwind_gyrostat_v1 --specwind-root ../experiments/qg_datasets \
#     --regen-windows 1000 --regen-every 5 --seed 0

experiment_id: G1L_direct_unet_tchannels_specwind_b16
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet_tchannels
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [128, 256, 512]
  num_res_blocks: 2
  use_obs_mask: true
  param_dim: 0
  cond_extra_dim: 0
training:
  epochs: 1200
  lr: 0.0005
  warmup_epochs: 40
  batch_size: 16
  num_workers: 10
  gradient_clip_val: 1.0
  # lambda_q = scale / Var(q_daily), Var measured on the first regeneration draw;
  # scale 3 selected by the E1 sweep on val (0.699 vs 0.688 at 1, 0.694 at 10).
  q_loss_weight_scale: 3.0
data:
  normalize: true
  # Test/val observing system = the gyrostat DA rows (S0 = S1 obs):
  # 3 psi1 columns per day, sequential sampler, 5% white noise.
  cols_per_day: 3
  obs_noise_std_frac: 0.05
  init_lag_days: 5.0
  cond_mode: none
  regen_every: 30
  # Train split only: a fresh draw per sample, 3-30 distinct (step, column)
  # slots per day, uniform over the 12 x 64 slots of a day (plan section 4.3).
  cols_per_day_min: 3
  cols_per_day_max: 30
  train_cols_sampling: uniform_slots
  # Train split only (2026-10-05, S1 keeps its altimetry error): each draw gets a total white
  # error ~ U[5%, 15%] and a per-pass correlated error (offset + tilt) ~ U[0, 15%] of the
  # window's psi1 std -- from the S0 obs model to the S1 one (evaluation/qg_specwind_s1.py).
  obs_error_aug: [0.05, 0.15, 0.15]
