# @package _global_
# Clone of L1b_direct_unet_s0s1 with data.normalize=true (normalization ablation
# Phase 2): per-channel z-score normalization of states/obs, using the shared
# stats in experiments/l96_norm_stats_obsj2.pt (see precompute_l96_norm_stats.py).
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: direct_unet
  state_dim: 24
  param_dim: 0
  direct_unet:
    hidden_channels: [64, 128, 256]
    dropout: 0.1
    cond_extra_dim: 0

training:
  stage1:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  bias_max: 0.2
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  # Reuse the canonical cached test_s0/test_s1 (same seeds/config as generating
  # them fresh would produce) instead of paying the slow per-window simulation
  # cost every training run. train/val are still generated fresh.
  test_cache: experiments/l96_datasets_obsj2_int100_nwin200.pt
