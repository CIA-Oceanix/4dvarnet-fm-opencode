# @package _global_
# monai_predict_state_cfm, L tier, default configuration per docs/scoping/wave2_benchmark_plan.md:
# monai + normalize + cosine + 400 epochs, NO obs-density augmentation
# (wave 1 showed augmentation's sign is family-dependent, so it is a labelled
# second arm rather than a default -- see docs/results/l96_default_config_benchmark_synthesis.md F2).
#
# train_tau_0_only: false -- the existing L2b/V3 configs set it TRUE, which makes
# the model a tau=0 point estimator rather than a generative flow and voids its
# CRPS column. These rows supersede those, they do not extend them.
defaults:
  - /lorenz96_default
  - _self_
model:
  model_type: monai_predict_state_cfm
  state_dim: 24
  param_dim: 0
  monai_predict_state_cfm:
    hidden_channels: [128, 256, 512]
    N_outer: 10
    sigma_prior: 0.5
    dropout: 0.1
    train_tau_0_only: false
    cond_extra_dim: 0
    num_res_blocks: 2
    norm_num_groups: 32
training:
  stage1: {epochs: 400, lr: 0.001, gradient_clip_val: 10.0, use_cosine_scheduler: true}
  stage2: {epochs: 0}
  batch_size: 16
data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  normalize: true
  obs_density_augment: false
  test_cache: /Odyssey/private/rfablet/Python/4dvarnet-fm-opencode/experiments/l96_datasets_obsj2_int100_nwin200.pt
