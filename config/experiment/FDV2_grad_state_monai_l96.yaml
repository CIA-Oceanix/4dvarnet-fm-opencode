# @package _global_
# RETRAIN under two fixes vs the original job 52926 recipe:
# 1. _normalize_channels' post-normalization bound on the grad term is now a
#    smooth tanh-based soft-clip (clip_range*tanh(t/clip_range)), not a hard
#    torch.clamp -- a saturated value now keeps a small gradient pulling it
#    back in, instead of the exactly-zero gradient a hard clamp gives there.
#    Normalization ITSELF is kept (not removed, unlike subgrad+state's own
#    residual channels) per prior published results (Fablet et al., JAMES)
#    on its importance for this class of gradient-conditioned solver.
# 2. grad_clip_range=5.0 (separate from clip_range=50.0, which still only
#    bounds the raw state branch -- unchanged, still a hard clamp, out of
#    scope here): with a hard clamp, 50 was a rarely-triggered safety
#    ceiling (see test_clip_range_inactive_in_distribution); with a smooth
#    tanh soft-clip, you want the nonlinearity to actually engage close to
#    the real operating range (grad is RMS-normalized to ~1 by construction)
#    rather than being so wide it's indistinguishable from the identity
#    everywhere in practice. Kept as a separate field specifically so this
#    doesn't also tighten the (untouched) state-branch clamp, which would
#    start clipping legitimate state excursions (|x| up to ~10 in-distribution,
#    per FourDVarNetSolver's own docstring -- well inside clip_range=50 but
#    not inside 5).
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: grad+state
    R_var: 0.5
    prior_weight: 1.0
    clip_range: 50.0
    grad_clip_range: 5.0
    trainable_prior_weight: true
    aux_var_cost_weight: 0.1
    unet_backbone: monai
    monai_norm_num_groups: 32

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
    obs_weight_lr_scale: 0.5
    prior_unet_lr_scale: 0.5
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
