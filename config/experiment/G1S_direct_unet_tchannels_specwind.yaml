# G1-S: G1 at the S capacity tier ([32, 64, 128], 2 res blocks, 3.68 M
# params); everything else identical to G1 (plan section 3.1).
#
#   python train_qg_neural.py --model-type direct_unet_tchannels --exp-id G1S_direct_unet_tchannels_specwind \
#     --exp-dir experiments/qg_specwind_neural/G1S_direct_unet_tchannels_specwind \
#     --specwind-spec qg_specwind_gyrostat_v1 --specwind-root ../experiments/qg_datasets \
#     --regen-windows 1000 --regen-every 5 --seed 0

experiment_id: G1S_direct_unet_tchannels_specwind
entry_point: train_qg_neural.py
system: qg
model_type: direct_unet_tchannels
qg:
  nx: 64
  state_dim: 8192
  obs_geometry: random_columns
  obs_field: psi
model:
  hidden_channels: [32, 64, 128]
  num_res_blocks: 2
  use_obs_mask: true
  param_dim: 0
  cond_extra_dim: 0
training:
  epochs: 200
  # Peak LR with a 5-epoch linear warm-up, then cosine to 0 (2026-10-05): at 1e-3 with
  # no warm-up the decoder's residual stream blew up (G1-L, G2, G3 collapsed by epoch 25).
  lr: 0.0003
  warmup_epochs: 5
  batch_size: 2
  gradient_clip_val: 1.0
  # lambda_q = scale / Var(q_daily), Var measured on the first regeneration draw;
  # scale 3 selected by the E1 sweep on val (0.699 vs 0.688 at 1, 0.694 at 10).
  q_loss_weight_scale: 3.0
data:
  normalize: true
  # Test/val observing system = the gyrostat DA rows (S0 = S1 obs):
  # 3 psi1 columns per day, sequential sampler, 5% white noise.
  cols_per_day: 3
  obs_noise_std_frac: 0.05
  init_lag_days: 5.0
  cond_mode: none
  # Train split only: a fresh draw per sample, 3-30 distinct (step, column)
  # slots per day, uniform over the 12 x 64 slots of a day (plan section 4.3).
  cols_per_day_min: 3
  cols_per_day_max: 30
  train_cols_sampling: uniform_slots
