# @package _global_
# Clean control for FDV1_obsstate_monai_l96_initvar01_XStier_auxpriorcost01.yaml:
# same ~half-S-tier UNet (hidden_channels=[24,48,96], monai_num_res_blocks=1,
# monai_norm_num_groups=8, 596,784 params) and init_state_var=0.1, but
# aux_var_cost_weight=0.0 (default -- no prior_unet built, no auxiliary loss
# term at all). Mirrors the existing clean-vs-aux paired-comparison pattern
# already used at M-tier (FDV1_obsstate_monai_l96_initvar01.yaml, job 53288)
# and S-tier (FDV1_obsstate_monai_l96_initvar01_Stier.yaml, job 53292).
#
# Purpose: job 53316 (same tier + aux_var_cost_weight=0.01) is tracking
# meaningfully behind job 53315 (S-tier + same aux weight) at matched
# epochs (e.g. epoch 32: 0.41 vs 0.95 val_loss) -- a real gap, but it's not
# yet clear whether that's the aux-loss degradation reappearing at this
# smaller capacity, or just this tier's own natural (aux-loss-free)
# convergence pace being slower. This run isolates that.
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [24, 48, 96]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: obs+state
    R_var: 0.5
    clip_range: 50.0
    init_state_var: 0.1
    unet_backbone: monai
    monai_norm_num_groups: 8
    monai_num_res_blocks: 1

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
