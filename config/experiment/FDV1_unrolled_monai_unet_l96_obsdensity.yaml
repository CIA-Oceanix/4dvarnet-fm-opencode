# @package _global_
# Fast-Y observation-density-augmented variant of FDV1_unrolled_monai_unet_l96
# (the unrolled solver's monai-backbone config), adding
# data.obs_density_augment=true -- same recipe as
# L1b_monai_unet_s0s1_norm_obsdensity.yaml (M-tier DirectUNet), which fixed
# the fast-Y reduced-density generalization gap found in PR #180 without
# sacrificing full-density accuracy.
#
# Deliberately does NOT add data.normalize=true, unlike the DirectUNet/CFM
# obsdensity configs: the existing FDV1_unrolled_monai_unet_l96 checkpoint
# was trained (and is consumed downstream by FDV1+SDA3-monai's hybrid eval)
# in raw physical units, with normalization handled by a separate raw-obs
# dataloader at eval time -- keeping this variant in the same convention
# avoids touching that eval-time plumbing.
#
# use_cosine_scheduler is not set explicitly here: it now defaults to true
# project-wide (conf/schema.py, since 2026-09-10), so this run gets cosine
# annealing automatically, same as the DirectUNet-M(aug) fix.
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [64, 128, 256]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: obs+state
    R_var: 0.5
    clip_range: 50.0
    unet_backbone: monai
    monai_norm_num_groups: 32

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
  obs_density_augment: true
  obs_density_full_prob: 0.4
  obs_density_min_keep: 0
