# @package _global_
# FDV2 subgrad+state on the S-tier MonaiUNet1D (hidden_channels=[32,64,128],
# monai_num_res_blocks=1, 1,055,544 params -- vs the M tier's
# hidden_channels=[64,128,256], monai_num_res_blocks=2, 5,889,048 params
# every earlier subgrad+state attempt used), plus the two settings that
# turned out to matter for FDV1 at this same tier:
#   - init_state_var=0.1 (random x_0 ~ N(0,0.1) instead of x_0=0) -- confirmed
#     harmless (often beneficial) for FDV1 at every tier tried.
#   - aux_var_cost_weight=0.01 -- the corrected pure
#     prior_cost(x_final)+prior_cost(states) auxiliary loss (no prior_weight/
#     obs_cost mixed in, 2026-09-11 fix). subgrad+state never trains
#     prior_weight itself (fixed at 1.0, _AUTOGRAD_MODES doesn't include this
#     mode), so this term only ever affects prior_unet + (via x_final)
#     the main solver -- the same tier-dependent interference profile found
#     for FDV1's obs+state architecture is the open question here.
# subgrad+state's own g_obs/g_prior residual channels are never run through
# _normalize_channels regardless of tier (2026-09-11 fix, unrelated to this
# config's tier/aux-weight choice) -- unchanged.
defaults:
  - /lorenz96_default
  - _self_

model:
  model_type: fourdvarnet
  state_dim: 24
  param_dim: 0
  fdv:
    hidden_channels: [32, 64, 128]
    time_emb_dim: 64
    N_outer: 10
    dropout: 0.1
    update_input: subgrad+state
    R_var: 0.5
    prior_weight: 1.0
    clip_range: 50.0
    trainable_prior_weight: true
    init_state_var: 0.1
    aux_var_cost_weight: 0.01
    unet_backbone: monai
    monai_norm_num_groups: 32
    monai_num_res_blocks: 1

training:
  stage1:
    epochs: 400
    lr: 0.001
    gradient_clip_val: 10.0
    use_cosine_scheduler: true
  stage2:
    epochs: 0

data:
  data_setup: s0_s1
  obs_j: 2
  param_dim: 0
  num_train_windows: 1000
  num_val_windows: 100
  num_test_windows: 200
  test_param_noise: 0.2
